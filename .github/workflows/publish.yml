name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: expose
    steps:
      - uses: actions/checkout@v4
        with:
          path: expose
          persist-credentials: false
      # @atom-forge/ship is a file:../ship dev dependency.
      - uses: actions/checkout@v4
        with:
          repository: atom-forge/ship
          ref: 23c002a10e2dea2ed8ec0ab823973f820c1bb03e
          path: ship
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run ship-it validate
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: npm pack --dry-run --ignore-scripts
      - run: npm publish --access public --ignore-scripts --provenance
